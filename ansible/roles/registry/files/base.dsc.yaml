properties:
  configurationVersion: 0.2.0
  resources:
    - resource: PSDscResources/Registry
      directives:
        description: Set taskbar alignment to left
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: TaskbarAl
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide taskbar widgets
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: TaskbarDa
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide taskbar chat icon
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: TaskbarMn
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide Task View button from taskbar
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: ShowTaskViewButton
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide search box from taskbar
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Search
        ValueName: SearchboxTaskbarMode
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide hidden files and folders
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: Hidden
        ValueType: Dword
        ValueData: "2"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide file extensions for known file types
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: HideFileExt
        ValueType: Dword
        ValueData: "1"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Hide protected operating system files
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: ShowSuperHidden
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Show thumbnails instead of icons
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: IconsOnly
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Enable classic context menu
      settings:
        Key: HKEY_CURRENT_USER\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32
        ValueName: ""
        ValueType: String
        ValueData: ""
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable snap assist flyout
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: EnableSnapAssistFlyout
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Dark mode for applications
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        ValueName: AppsUseLightTheme
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Dark mode for system UI
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        ValueName: SystemUsesLightTheme
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable transparency effects
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        ValueName: EnableTransparency
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable suggested content in Windows
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        ValueName: SubscribedContent-338393Enabled
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable Windows tips and suggestions
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        ValueName: SubscribedContent-353694Enabled
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable app suggestions in Start Menu
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
        ValueName: SubscribedContent-338388Enabled
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable advertising ID
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo
        ValueName: Enabled
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable tailored experiences with diagnostic data
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Privacy
        ValueName: TailoredExperiencesWithDiagnosticDataEnabled
        ValueType: Dword
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Enable clipboard history (Win+V)
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Clipboard
        ValueName: EnableClipboardHistory
        ValueType: Dword
        ValueData: "1"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Disable window animations
      settings:
        Key: HKEY_CURRENT_USER\Control Panel\Desktop\WindowMetrics
        ValueName: MinAnimate
        ValueType: String
        ValueData: "0"
        Force: true
    - resource: PSDscResources/Registry
      directives:
        description: Show window contents while dragging
      settings:
        Key: HKEY_CURRENT_USER\Control Panel\Desktop
        ValueName: DragFullWindows
        ValueType: String
        ValueData: "1"
        Force: true
