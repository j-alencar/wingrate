# can be overridden by profiles
ansible_connection: local
ansible_become_method: runas
admin_domain: "{{ lookup('env', 'ADMIN_DOMAIN') }}"
admin_name: "{{ lookup('env', 'ADMIN_NAME') }}"
admin_separator: '\'
admin_user: "{{ admin_domain ~ admin_separator ~ admin_name if admin_domain else admin_name }}"

user_home: "{{ ansible_env.USERPROFILE | default(ansible_env.HOME) }}"
appdata: "{{ ansible_env.APPDATA }}"
localappdata: "{{ ansible_env.LOCALAPPDATA }}"

min_disk_space_gb: 50
min_memory_gb: 8
